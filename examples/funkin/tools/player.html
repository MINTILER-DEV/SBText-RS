<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friday Night Funkin' · SBText</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d19;color:#f4edf7;font:15px system-ui;min-height:100vh;display:grid;place-content:center;gap:16px}main{width:min(96vw,960px)}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}strong{font-size:18px}small{color:#bba8c6}canvas{display:block;width:100%;aspect-ratio:4/3;background:#171220;outline:none;box-shadow:0 20px 90px #0008}button,a{font:inherit;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:#f653a1;color:#160e1c;text-decoration:none;font-weight:700}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}#status{margin-left:auto;font-size:13px;color:#bba8c6}#start{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#171220ed;gap:14px}#start button{font-size:22px}#stage{position:relative}#start p{max-width:340px;margin:0;line-height:1.5}
</style>
<main><header><strong>FRIDAY NIGHT FUNKIN' <small>/ SBText</small></strong><small>Unofficial Scratch remake</small></header>
<div id="stage"><canvas id="canvas" width="960" height="720" tabindex="0"></canvas><div id="start"><button id="launch">LOAD & PLAY</button><p>Original charts, music and art.<br>Use arrows or A S W D. Enter selects. Esc pauses.</p><small id="loadstatus">61 tracks · 167 charts</small></div></div>
<footer><button id="restart">Green flag</button><button id="fullscreen">Fullscreen</button><a href="/Funkin.sb3" download>Download .sb3</a><span id="status">Ready</span></footer></main>
<script src="/vendor/storage.js"></script><script src="/vendor/render.js"></script><script src="/audio.js"></script><script src="/svg.js"></script><script src="/vendor/vm.js"></script>
<script>
const canvas=document.querySelector('#canvas');const vm=window.vm=new VirtualMachine();const renderer=new ScratchRender(canvas);vm.attachRenderer(renderer);vm.attachV2BitmapAdapter(new ScratchSVGRenderer.BitmapAdapter());vm.attachStorage(new ScratchStorage.ScratchStorage());vm.attachAudioEngine(new ScratchAudio());vm.setCompatibilityMode(true);vm.start();
let ready=false;
const status=s=>document.querySelector('#status').textContent=s;
async function load(){document.querySelector('#launch').disabled=true;document.querySelector('#launch').textContent='LOADING...';document.querySelector('#loadstatus').textContent='Loading and decoding music. This may take a moment.';try{await vm.runtime.audioEngine.audioContext.resume();await vm.loadProject(await(await fetch('/'+(new URLSearchParams(location.search).get('project')||'Funkin.sb3'))).arrayBuffer());ready=true;window.ready=true;document.querySelector('#start').remove();canvas.focus();vm.greenFlag();status('Arrows / A S W D / H J K L · Enter · Esc')}catch(e){document.querySelector('#loadstatus').textContent=e.message;console.error(e)}}
document.querySelector('#launch').onclick=load;document.querySelector('#restart').onclick=()=>{if(ready){vm.greenFlag();canvas.focus()}};document.querySelector('#fullscreen').onclick=()=>document.querySelector('#stage').requestFullscreen();
window.addEventListener('keydown',e=>{if(!ready)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Escape','Enter'].includes(e.key))e.preventDefault();vm.postIOData('keyboard',{key:e.key==='Escape'?'p':e.key,isDown:true})});window.addEventListener('keyup',e=>vm.postIOData('keyboard',{key:e.key==='Escape'?'p':e.key,isDown:false}));window.addEventListener('blur',()=>{for(const key of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','a','s','w','d','h','j','k','l','Enter','Escape','p',' '])vm.postIOData('keyboard',{key,isDown:false})});
window.game={get(name){const t=vm.runtime.getTargetForStage();return Object.values(t.variables).find(v=>v.name===name)?.value},set(name,value){const t=vm.runtime.getTargetForStage();const v=Object.values(t.variables).find(v=>v.name===name);if(!v)throw Error(name);v.value=value},call(name,args=[]){const t=vm.runtime.getTargetForStage();const b=Object.values(t.blocks._blocks).find(b=>b.opcode==='procedures_call'&&b.mutation.proccode.split(' ')[0]===name);if(!b)throw Error('Unknown procedure '+name);const c=JSON.parse(JSON.stringify(b));c.id='__test_'+Date.now();c.next=null;c.parent=null;c.inputs={};c.topLevel=true;const ids=JSON.parse(c.mutation.argumentids||'[]');ids.forEach((id,i)=>{const k=c.id+'_'+i;t.blocks.createBlock({id:k,opcode:'text',inputs:{},fields:{TEXT:{name:'TEXT',value:String(args[i])}},next:null,parent:c.id,shadow:true,topLevel:false});c.inputs[id]={name:id,block:k,shadow:k}});t.blocks.createBlock(c);return vm.runtime._pushThread(c.id,t,{stackClick:true})}};
</script>
